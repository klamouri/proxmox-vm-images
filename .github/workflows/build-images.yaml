name: Build Proxmox VM Images

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 0.0.1)'
        required: true
        type: string
      image_name:
        description: 'Image to build (e.g., ubuntu-24.04-noble-base or ALL)'
        required: true
        type: string
        default: 'ALL'

jobs:
  validate-inputs:
    runs-on: ubuntu-latest
    outputs:
      image_list: ${{ steps.get-image-list.outputs.images }}
    steps:
      - name: Validate version format
        run: |
          if ! [[ "${{ github.event.inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format. Must be in format: x.y.z (e.g., 0.0.1)"
            exit 1
          fi
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Validate image name
        run: |
          if [[ "${{ github.event.inputs.image_name }}" != "ALL" ]]; then
            if [ ! -d "${{ github.event.inputs.image_name }}" ]; then
              echo "::error::Image directory '${{ github.event.inputs.image_name }}' not found"
              exit 1
            fi
          fi
      - id: get-image-list
        name: Get list of images to build
        run: |
          if [[ "${{ github.event.inputs.image_name }}" == "ALL" ]]; then
            # Find all directories with .pkr.hcl files
            IMAGES=$(find . -maxdepth 2 -name "*.pkr.hcl" -exec dirname {} \; | sort -u | sed 's|^\./||' | jq -R -s -c 'split("\n")[:-1]')
          else
            IMAGES="[\"${{ github.event.inputs.image_name }}\"]"
          fi
          echo "images=$IMAGES" >> $GITHUB_OUTPUT

  build-image:
    runs-on: ubuntu-latest
    needs: validate-inputs
    strategy:
      matrix:
        image_name: ${{ fromJson(needs.validate-inputs.outputs.image_list) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build VM image (${{ matrix.image_name }})
        uses: ./.github/vm_build
        with:
          image_name: ${{ matrix.image_name }}
          version: ${{ github.event.inputs.version }}

  create-release:
    needs: [validate-inputs, build-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Release v${{ github.event.inputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: artifacts/**/*

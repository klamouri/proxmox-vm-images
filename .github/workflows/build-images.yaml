name: Build Proxmox VM Images

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 0.0.1)'
        required: true
        type: string
      image_name:
        description: 'Image to build (e.g., base-images/ubuntu-24.04-noble, specialized-images/docker, or ALL)'
        required: true
        type: string
        default: 'ALL'

permissions:
  id-token: write
  attestations: write

jobs:
  validate-inputs:
    runs-on: ubuntu-latest
    outputs:
      base_images: ${{ steps.get-image-lists.outputs.base_images }}
      specialized_images: ${{ steps.get-image-lists.outputs.specialized_images }}
      build_all: ${{ steps.get-image-lists.outputs.build_all }}
    steps:
      - name: Validate version format
        run: |
          if ! [[ "${{ github.event.inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format. Must be in format: x.y.z (e.g., 0.0.1)"
            exit 1
          fi
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Validate image name
        run: |
          if [[ "${{ github.event.inputs.image_name }}" != "ALL" ]]; then
            if [ ! -d "${{ github.event.inputs.image_name }}" ]; then
              echo "::error::Image directory '${{ github.event.inputs.image_name }}' not found"
              exit 1
            fi
          fi
      - id: get-image-lists
        name: Get lists of images to build
        run: |
          if [[ "${{ github.event.inputs.image_name }}" == "ALL" ]]; then
            # Find base image folders
            BASE_IMAGES=$(find base-images -mindepth 1 -maxdepth 1 -type d | sed 's|^|"|;s|$|"|' | jq -s -c '.')
            # Find specialized image folders
            SPECIALIZED_IMAGES=$(find specialized-images -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sed 's|^|"|;s|$|"|' | jq -s -c '.' || echo "[]")
            echo "build_all=true" >> $GITHUB_OUTPUT
          else
            # Check if it's a base or specialized image
            if [[ "${{ github.event.inputs.image_name }}" == base-images/* ]]; then
              BASE_IMAGES="[\"${{ github.event.inputs.image_name }}\"]"
              SPECIALIZED_IMAGES="[]"
            else
              BASE_IMAGES="[]"
              SPECIALIZED_IMAGES="[\"${{ github.event.inputs.image_name }}\"]"
            fi
            echo "build_all=false" >> $GITHUB_OUTPUT
          fi
          echo "base_images=$BASE_IMAGES" >> $GITHUB_OUTPUT
          echo "specialized_images=$SPECIALIZED_IMAGES" >> $GITHUB_OUTPUT

  build-base-images:
    runs-on: ubuntu-latest
    needs: validate-inputs
    if: needs.validate-inputs.outputs.base_images != '[]'
    strategy:
      matrix:
        image_name: ${{ fromJson(needs.validate-inputs.outputs.base_images) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Parse image name
        id: parse-image
        run: |
          IMAGE_BASENAME=$(basename "${{ matrix.image_name }}")
          echo "image_basename=$IMAGE_BASENAME" >> $GITHUB_OUTPUT
      - name: Build base image (${{ matrix.image_name }})
        uses: ./.github/vm_build
        with:
          image_path: ${{ matrix.image_name }}
          image_name: ${{ steps.parse-image.outputs.image_basename }}
          version: ${{ github.event.inputs.version }}

  build-specialized-images:
    runs-on: ubuntu-latest
    needs: [validate-inputs, build-base-images]
    if: always() && needs.validate-inputs.outputs.specialized_images != '[]'
    strategy:
      matrix:
        image_name: ${{ fromJson(needs.validate-inputs.outputs.specialized_images) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Parse base image name
        id: parse-base
        run: |
          # Extract base image name from specialized image name
          # Format: specialized-images/{baseImageName}-{specialization}
          IMAGE_DIR="${{ matrix.image_name }}"
          IMAGE_BASENAME=$(basename "$IMAGE_DIR")
          # Remove last component after last dash to get base image name
          BASE_IMAGE=$(echo "$IMAGE_BASENAME" | sed 's/-[^-]*$//')
          echo "base_image=$BASE_IMAGE" >> $GITHUB_OUTPUT
          echo "image_basename=$IMAGE_BASENAME" >> $GITHUB_OUTPUT
          echo "Specialized image: $IMAGE_BASENAME"
          echo "Base image: $BASE_IMAGE"
      - name: Download base image artifacts
        if: needs.validate-inputs.outputs.build_all == 'true'
        uses: actions/download-artifact@v4
        with:
          path: base-artifacts
          pattern: ${{ steps.parse-base.outputs.base_image }}.v*
      - name: Setup base image artifacts for specialized builds
        id: setup-base-artifacts
        shell: bash
        run: |
          mkdir -p build/base-images/${{ steps.parse-base.outputs.base_image }}
          # Find and copy base image artifacts
          find "${{ steps.parse-base.outputs.base_image }}" -name "*.img" -exec cp {} build/base-images/${{ steps.parse-base.outputs.base_image }}/ \; 2>/dev/null || true
          ls -la build/base-images/${{ steps.parse-base.outputs.base_image }}/ || true
          echo "base_image_path=$(find "${{ steps.parse-base.outputs.base_image }}" -name "*.img" | sort -V | tail -n 1)" >> $GITHUB_OUTPUT


      - name: Build specialized image (${{ matrix.image_name }})
        uses: ./.github/vm_build
        with:
          image_path: ${{ matrix.image_name }}
          image_name: ${{ steps.parse-base.outputs.image_basename }}
          version: ${{ github.event.inputs.version }}
          base_image_path: ${{ steps.setup-base-artifacts.outputs.base_image_path }}

  create-release:
    needs: [build-base-images, build-specialized-images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Release v${{ github.event.inputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: artifacts/**/*

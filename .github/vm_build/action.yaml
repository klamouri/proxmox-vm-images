name: Build VM Image
description: |
  This action builds a VM image using Packer, QEMU and Ansible, and uploads the resulting image as an artifact.
inputs:
  image_path:
    required: true
    description: 'Path to the image directory containing Packer templates'
  image_name:
    required: true
    description: 'Name of the image to build'
  version:
    required: true
    description: 'Version tag for the image'
  base_image_path:
    required: false
    description: 'Path to base image file for specialized builds'

runs:
  using: "composite"
  steps:
    - name: Install QEMU
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-system-x86 xorriso

    - name: Set up Packer
      uses: hashicorp/setup-packer@main
      with:
        version: "1.9.4"

    - name: Set up Ansible
      shell: bash
      run: |
        sudo apt-get install -y ansible

    - name: Build VM image
      shell: bash
      run: |
        cd  ${{ inputs.image_path }}
        packer init .
        packer validate .
        # Here would would add the parameter `-var qemu_accelerator=kvm` if Github Actions hosted runners supported KVM
        if [ -n "${{ inputs.base_image_path }}" ]; then
          # Specialized image build with base image dependency
          packer build \
            -var build_directory=../../build/${{ inputs.image_path }} \
            -var image_name=${{ inputs.image_name }}.v${{ inputs.version }}.img \
            -var base_image_path=../../${{ inputs.base_image_path }} \
            .
        else
          # Base image build without base image dependency
          packer build \
            -var build_directory=../../build/${{ inputs.image_path }} \
            -var image_name=${{ inputs.image_name }}.v${{ inputs.version }}.img \
            .
        fi

    - name: List generated images
      shell: bash
      run: |
        find build/${{ inputs.image_path }}/* -type f -name "*.img"

    - name: Upload image as artifact
      id: upload-image
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.image_name }}.v${{ inputs.version }}
        path: build/${{ inputs.image_path }}/${{ inputs.image_name }}.v${{ inputs.version }}.img

    - uses: actions/attest-build-provenance@v2
      with:
        subject-name: ${{ inputs.image_name }}.v${{ inputs.version }}
        subject-digest: sha256:${{ steps.upload-image.outputs.artifact-digest }}
